[package]
name = "mail-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mail-domain.workspace = true
mail-mime.workspace = true
thiserror.workspace = true
base64 = "0.22"
# IMAP response parsing. Chosen over imap-codec because imap-types::MessageDataItem has no
# catch-all, so an X-GM-* attribute makes the whole untagged FETCH a parse error. This crate
# ships parser/gmail.rs. nom::streaming Err::Incomplete maps onto Progress::Need(Read).
imap-proto = "0.16"

[lints]
workspace = true

[dev-dependencies]
chrono.workspace = true
nom = "7"
uuid = { workspace = true }
