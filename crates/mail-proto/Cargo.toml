[package]
name = "mailo-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Sans-I/O state machines for IMAP, POP3, SMTP submission, JMAP and ManageSieve."
readme = "README.md"
keywords = ["email", "imap", "smtp", "pop3", "jmap"]
categories = ["email", "network-programming"]

# Published as mailo-proto; used in code as `mail_proto`, as the workspace always has.
[lib]
name = "mail_proto"

[dependencies]
porter-core.workspace = true
porter-provider.workspace = true
mail-domain.workspace = true
mail-mime.workspace = true
chrono.workspace = true
thiserror.workspace = true
base64 = "0.22"
# A-labels for an envelope domain when the server did not list SMTPUTF8 (RFC 6531).
# The major is already locked at 1.1.0 by the `url` crate; this calls `idna::domain_to_ascii`.
idna = "1"
# IMAP response parsing. Chosen over imap-codec because imap-types::MessageDataItem has no
# catch-all, so an X-GM-* attribute makes the whole untagged FETCH a parse error. This crate
# ships parser/gmail.rs. nom::streaming Err::Incomplete maps onto Progress::Need(Read).
imap-proto = "0.16"
nom = "7"
# JMAP's requests and responses (`jmap`). Already in the lock through mail-runtime.
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
porter-ids.workspace = true
# The values a test starts from (`mail_domain::testing`): the program never has them.
mail-domain = { workspace = true, features = ["testing"] }
proptest = "1"
chrono.workspace = true
nom = "7"
uuid = { workspace = true }
