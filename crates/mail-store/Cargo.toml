[package]
name = "mail-store"
# The app side: I/O and policy, not a library for others.
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
porter-core.workspace = true
mail-domain.workspace = true
chrono.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
uuid = { workspace = true }
# `hooks`: the writer's commit hook, which is how the store knows a write committed and says so
# (`changes`).
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
blake3 = "1"
parking_lot = "0.12"
# What a commit touched (`changes::Topics`). Already in the lock through rusqlite, at this major
# version. MIT OR Apache-2.0.
bitflags = "2"
tempfile = { version = "3", optional = true }

[features]
# What a test of this crate or of one above it seeds a store with, and the few things only a test
# does to one (`testing`). Off in the program: nothing above the store speaks SQL.
testing = ["dep:tempfile"]

[dev-dependencies]
proptest = "1"
tempfile = "3"
# Its own tests use the seeding they share with the crates above.
mail-store = { path = ".", features = ["testing"] }

[lints]
workspace = true
