[package]
name = "mail-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
porter-core.workspace = true
mail-domain.workspace = true
chrono.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
uuid = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1"
parking_lot = "0.12"
tempfile = { version = "3", optional = true }

[features]
# What a test of this crate or of one above it seeds a store with, and the few things only a test
# does to one (`testing`). Off in the program: nothing above the store speaks SQL.
test-support = ["dep:tempfile"]

[dev-dependencies]
proptest = "1"
tempfile = "3"
# Its own tests use the seeding they share with the crates above.
mail-store = { path = ".", features = ["test-support"] }

[lints]
workspace = true
