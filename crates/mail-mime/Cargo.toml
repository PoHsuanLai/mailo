[package]
name = "mailo-mime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Email messages in and out: MIME parsing and building, authentication results, unsubscribe headers, and read receipts."
readme = "README.md"
keywords = ["email", "mime", "mdn", "bimi"]
categories = ["email", "parser-implementations", "encoding"]

# Published as mailo-mime; used in code as `mail_mime`, as the workspace always has.
[lib]
name = "mail_mime"

[dependencies]
mail-domain.workspace = true
chrono.workspace = true
thiserror.workspace = true
# `full_encoding`: without it every multi-byte charset — Big5, GBK, Shift_JIS, EUC-KR, in bodies
# and in RFC 2047 encoded-words alike — is decoded as if it were UTF-8, which is to say lost.
mail-parser = { version = "0.11", features = ["full_encoding"] }
mail-builder = "1"
base64 = "0.22"
# Parses the URLs in `List-Unsubscribe`, which are untrusted.
url = "2"
# Raw 8-bit headers (see `charset.rs`): decoding by label, and guessing when there is none.
encoding_rs = "0.8"
chardetng = "1"

[dev-dependencies]
uuid.workspace = true
# The values a test starts from (`mail_domain::testing`): the program never has them.
mail-domain = { workspace = true, features = ["testing"] }
chrono.workspace = true
proptest = "1"

[lints]
workspace = true
