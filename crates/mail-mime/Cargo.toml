[package]
name = "mail-mime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mail-domain.workspace = true
chrono.workspace = true
thiserror.workspace = true
# `full_encoding`: without it every multi-byte charset — Big5, GBK, Shift_JIS, EUC-KR, in bodies
# and in RFC 2047 encoded-words alike — is decoded as if it were UTF-8, which is to say lost.
mail-parser = { version = "0.11", features = ["full_encoding"] }
mail-builder = "1"
ammonia = "4"
base64 = "0.22"
# Already here through ammonia. Parses the URLs in `List-Unsubscribe`, which are untrusted.
url = "2"
# Raw 8-bit headers (see `charset.rs`): decoding by label, and guessing when there is none.
encoding_rs = "0.8"
chardetng = "1"
# Pinned to ammonia 4.2's own html5ever, deliberately: the block parser reads the sanitizer's
# output, so it must tokenize it with the same parser that produced it. If an ammonia bump
# moves this, move this line in the same commit.
html5ever = "0.40"

[dev-dependencies]
uuid.workspace = true
mail-domain.workspace = true
chrono.workspace = true
proptest = "1"
html5ever = "0.40"

[lints]
workspace = true
