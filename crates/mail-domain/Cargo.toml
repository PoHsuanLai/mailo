[package]
name = "mail-domain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
porter-core.workspace = true
porter-provider.workspace = true
serde.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true

[features]
# The values a test starts from (`mail_domain::testing`): off in the program.
testing = []

[dev-dependencies]
serde_json = "1"
proptest = "1"
# Its own tests use the same defaults the crates above do.
mail-domain = { path = ".", features = ["testing"] }

[lints]
workspace = true
