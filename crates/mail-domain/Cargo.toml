[package]
name = "mailo-domain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The vocabulary of a mail client as plain data and pure functions: messages, threads, mailboxes, drafts, filters, views and threading."
readme = "README.md"
keywords = ["email", "mail", "imap", "threading"]
categories = ["email", "data-structures"]

# Published as mailo-domain; used in code as `mail_domain`, as the workspace always has.
[lib]
name = "mail_domain"

[dependencies]
porter-core.workspace = true
porter-provider.workspace = true
serde.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true

[features]
# The values a test starts from (`mail_domain::testing`): off in the program.
testing = []

[dev-dependencies]
serde_json = "1"
proptest = "1"
# Its own tests use the same defaults the crates above do.
mail-domain = { package = "mailo-domain", path = ".", features = ["testing"] }

[lints]
workspace = true
