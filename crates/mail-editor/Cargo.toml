[package]
name = "mailo-editor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The composer's rich-text document as pure edits: blocks, operations, undo, markdown shortcuts, slash commands, and writers to HTML and format=flowed."
readme = "README.md"
keywords = ["email", "editor", "rich-text", "document"]
categories = ["email", "text-editing"]

# Published as mailo-editor; used in code as `mail_editor`, as the workspace always has.
[lib]
name = "mail_editor"

[dependencies]
mail-domain.workspace = true
mail-mime.workspace = true
# Grapheme clusters: the caret and its edits count what a person sees as one character.
unicode-segmentation = "1.13"

[dev-dependencies]
proptest = "1"
# The values a test starts from (`mail_domain::testing`): the program never has them.
mail-domain = { workspace = true, features = ["testing"] }

[lints]
workspace = true
