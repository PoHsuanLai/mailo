[package]
name = "mail-ui"
# mailo's window, over the client: not a library for others.
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "mailo's window, drawn with quire over a mail client"
repository = "https://github.com/PoHsuanLai/mailo"
authors = ["Po Hsuan Lai <pohsuanlai0208@gmail.com>"]

[features]
# Desktop extras (design/36 rule 3): what only our desktop has. Here: a saved file opens in
# anyview, the desktop's viewer, over the session bus (`ui/downloads/open.rs`), with the system's
# app when anyview does not answer. Off, a file opens in the system's app alone.
quire-desktop = []
# anyview's peek and card (github.com/PoHsuanLai/anyview) for the attachments mailo does not draw
# itself: a picture in the reader's strip and a card in Peek, both over the stored bytes
# (`ui/reading/anyview.rs`). Off, the strip shows a picture's or a PDF's thumbnail and Peek those,
# the calendars, contacts and messages mailo reads itself, and "no preview" for the rest.
anyview = ["dep:anyview-peek", "dep:anyview-core"]

[dependencies]
# The folder Open writes a part into before the system opens it (`reading/peek/part.rs`): made
# fresh for each run, named so no one can guess it, and only its owner's.
tempfile = "3"
porter-core.workspace = true
porter-provider.workspace = true
porter-service.workspace = true
# `Secrets`, the seam porter's service is built over; no store feature, so no keyring and no zbus.
porter-secrets.workspace = true
mail-domain.workspace = true
# Everything the window knows of mail: values read, commands made, servers asked, all through the
# one client. No `mail-core`, `mail-store` or `mail-runtime`: a store is not something the window
# can name. `desktop` names the desktop's notification service, which the window speaks to itself.
mail-client = { workspace = true, features = ["desktop"] }
# The OpenPGP and S/MIME halves are features of the library; this crate uses both.
mail-mime = { workspace = true, features = ["openpgp", "smime"] }
mail-proto.workspace = true
mail-pim.workspace = true
serde.workspace = true
# What the window logs; the program installs the one logger it goes through.
log.workspace = true
serde_json = "1"
# `sync` for the channel the Original frame's image fetches reach their worker through
# (`ui/original/net.rs`); already in the tree through reqwest and ds-blitz.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
chrono.workspace = true
# The renderer is quire's `ds-blitz` (Blitz, drawn with wgpu); dioxus itself brings none.
dioxus = { version = "0.7" }
# quire, the shared design system (github.com/PoHsuanLai/quire), pinned as the desktop manifest pins
# it: the `.git` URL and the release's full rev, the release named after it. The same spelling as
# every other consumer (anyview, porter), or cargo holds two quires that no [patch] unifies.
# To try an unreleased quire, put a `[patch]` naming a checkout in a `.cargo/config.toml` in the
# work directory above the checkouts (cargo reads it from parent directories), never in this repo:
# its own `.cargo/config.toml`, if any, holds build settings only.
# chordkit, the keymap core quire resolves keys with (actions, chords with a `Primary` modifier, the
# display). quire re-exports only `StandardAction`; mailo names `Action`, `AppAction`, `Context` and
# `Chord` as well. The rev quire pins (`docs/workspace-deps.toml`), so one chordkit is built.
chordkit = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "99eec9ddd03ee345b669fcc7954ed44590724290" }
ds = { git = "https://github.com/PoHsuanLai/quire.git", rev = "d17e19da64c8845d8eb413784b2d84f177a86767" }  # d17e19da (v0.3.49; forks blitz 41134ff3, blitz-kit 80938e37)
# Settings I/O: `appearance.toml` (imported once from `appearance.json`), the settings portal.
ds-settings = { git = "https://github.com/PoHsuanLai/quire.git", rev = "d17e19da64c8845d8eb413784b2d84f177a86767", features = ["dioxus"] }  # d17e19da (v0.3.49; forks blitz 41134ff3, blitz-kit 80938e37)
# The account sheets' views: `ds_shell::accounts`, the parts `sill` draws the same sheet with.
# Only the accounts module is used; the shell's own surfaces (bar, dock, lock) are not drawn here.
ds-shell = { git = "https://github.com/PoHsuanLai/quire.git", rev = "d17e19da64c8845d8eb413784b2d84f177a86767" }  # d17e19da (v0.3.49; forks blitz 41134ff3, blitz-kit 80938e37)
# anyview, the viewer's light tier, at the rev of its main that names the quire rev above (the same
# spelling as quire, so one quire is built). `anyview-core` is the vocabulary (`Input`, `ReadAt`:
# how the store's bytes go in); `anyview-peek` the peek worker and, with `pane`, the card that draws
# what was peeked. Headless otherwise: no media player, no D-Bus.
anyview-core = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "d0a5c0ba2bedd4b9eac9a656324904574dd8ad54", optional = true }
anyview-peek = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "d0a5c0ba2bedd4b9eac9a656324904574dd8ad54", default-features = false, features = ["pane"], optional = true }
# `mailo.toml`, and the `appearance.toml` written once on the first run after the move.
toml = "1"
# The window: quire's Blitz host (the window, its fonts, focus, clipboard, PDF output), and
# `print`: the system's print dialog for a PDF (the desktop portal on Linux, else the PDF opened
# in the viewer); `spell`: the composer's spelling, against the system's Hunspell dictionaries
# (none is bundled); `pdf` also rasterises a PDF attachment's first page (`PdfFileThumb`).
ds-blitz = { git = "https://github.com/PoHsuanLai/quire.git", rev = "d17e19da64c8845d8eb413784b2d84f177a86767", features = ["pdf", "print", "spell"] }  # d17e19da (v0.3.49; forks blitz 41134ff3, blitz-kit 80938e37)
blitz-dom = { workspace = true }
dioxus-native-dom = { workspace = true }
base64 = "0.22"
# Grapheme clusters for caret movement and backspace. Unicode Standard Annex #29.
unicode-segmentation = "1.13"
# Already a dependency of every id type. Named here for the ids the window makes and parses.
uuid = { workspace = true }
# Opens a browser sign-in's address from the Add account sheet. Already in the lock through
# dioxus-native, at this version and with its default (empty) features. MIT OR Apache-2.0.
webbrowser = "=1.2.4"
# A link read into its parts (`ui/original/consent.rs`) and a path made one (`ui/downloads/open.rs`).
url = "2"

# The native file dialog beside the Import and Export sheets' typed path. Pinned at the version
# dioxus-desktop linked when the window was a webview; moving it is a decision of its own.
#
# On Linux and the BSDs, through the desktop portal (and so from inside a Flatpak), with no GTK.
[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
# The unread count on the launcher entry (`launcher/session.rs`): one signal on the session bus.
# Already in the lock through notify-rust and the keyring's Secret Service store, at this version
# and with these (its default) features. MIT.
zbus = "5.19"

[target.'cfg(target_os = "macos")'.dependencies]
# The application delegate (open-URL, Dock reopen): the one crate allowed `unsafe`.
mail-appkit.workspace = true
objc2 = "0.6"
# `NSWorkspace`'s mailto: handler and the request to change it (`mail_handler`), which hears its
# answer in a block.
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSURL", "NSError", "NSFileManager"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSDockTile", "NSWorkspace", "block2"] }

# On macOS and Windows, the system's own dialog, which rfd uses with no feature at all.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[dev-dependencies]
# The values a test starts from (`mail_domain::testing`): the program never has them.
mail-domain = { workspace = true, features = ["testing"] }
# Seeding a store without writing SQL (`mail_store::testing`): the program never has it.
mail-store = { workspace = true, features = ["testing"] }
# A test's double at a seam keeping what a server gave in the window's store
# (`Client::store_for_test`): the program never has it.
mail-client = { workspace = true, features = ["testing"] }
# The doubles at the runtime's seams (`mail_core::testing`): the program never has them.
mail-core = { workspace = true, features = ["testing"] }
porter-secrets = { workspace = true, features = ["testing"] }
# Read back by the window's own tests (reader blocks, print, PGP/S-MIME composer); not used by the
# window itself, which gets them from `mail-core` and quire.
# Provider icons, and the reader's attachment previews (`preview.rs`): PNG, JPEG, GIF and WebP,
# decoded under size limits. Already in the lock through blitz-dom and quire, with these codecs;
# no other format is decoded, and SVG is never drawn.
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "gif", "webp"] }
# The OS random number generator for OpenPGP key generation and sealing (`pgp/`) and S/MIME
# sealing (`smime/`). rPGP's own `rand` generation; already in the tree. For every target: it had
# been listed under Linux alone, where `pgp/` would not have built anywhere else.
rand = "0.8"
# `re:/pattern/`. Already in the tree; depended on directly so the size caps are ours.
regex = "1"
# A PDF attachment's later pages in the viewer (`preview.rs`): quire rasterises only a first page.
# The same version quire names, so the tree holds one pdfrum.
# The print tests read printouts back with it too (`ui/print/pdf_tests.rs`).
pdfrum = { version = "0.5", default-features = false, features = ["vello-cpu"] }
# A paused clock, so a test drives the search box's debounce instead of sleeping through it.
tokio = { version = "1", features = ["test-util"] }
dioxus-ssr = "0.7"
uuid = { workspace = true }
# The linter (`lint::assert_clean`, the markup lint) and the test driver (`Harness`, `Driver`,
# `Query`, `snapshot`; `pdf` is `Harness::pdf` for the print tests): quire's own crates, at the
# same tag.
ds-lint = { git = "https://github.com/PoHsuanLai/quire.git", rev = "d17e19da64c8845d8eb413784b2d84f177a86767" }  # d17e19da (v0.3.49; forks blitz 41134ff3, blitz-kit 80938e37)
ds-harness = { git = "https://github.com/PoHsuanLai/quire.git", rev = "d17e19da64c8845d8eb413784b2d84f177a86767", features = ["pdf"] }  # d17e19da (v0.3.49; forks blitz 41134ff3, blitz-kit 80938e37)
# The throwaway certificate authority `tests/app/smime.rs` builds its fixtures with
# (`mail-mime/tests/smime_support`). All already in the tree through `mail-mime`.
x509-cert = { version = "0.2", features = ["builder"] }
der = "0.7"
spki = "0.7"
const-oid = "0.9"
cms = "0.2"
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }
# What a test reads back of a key the keyring holds (`ui/pgp/tests.rs`).
mail-runtime = { workspace = true }

[lints]
workspace = true
