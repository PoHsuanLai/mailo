[package]
name = "mailo-pim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "vCard, iCalendar invitations and CardDAV requests and replies, as pure text-in, values-out code."
readme = "README.md"
keywords = ["vcard", "icalendar", "carddav", "itip"]
categories = ["email", "parser-implementations"]

# Published as mailo-pim; used in code as `mail_pim`, as the workspace always has.
[lib]
name = "mail_pim"

[dependencies]
mail-domain.workspace = true
thiserror.workspace = true
chrono.workspace = true
# The IANA zones an invitation's `TZID` names, and their rules, compiled in: no zoneinfo files
# are read. MIT/Apache-2.0; its build script is only for optional features, so by default it
# brings nothing but `phf`.
chrono-tz = "0.10"
# Charsets named by vCard 2.1's `CHARSET` parameter. Already in the tree through reqwest.
encoding_rs = "0.8"
# The WebDAV multistatus replies CardDAV answers in. A read-only tree with namespaces, which is
# all a `PROPFIND` or `REPORT` answer needs; its one dependency, memchr, is already here.
roxmltree = "0.21"
# The Windows zone names Outlook and Exchange write in `TZID`, as IANA ones (CLDR's table).
windows-zones.workspace = true

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
