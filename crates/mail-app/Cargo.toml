[package]
name = "mail-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mail_app"
path = "src/lib.rs"

[[bin]]
name = "mailo"
path = "src/main.rs"

# A webview heartbeat probe: it opens a Dioxus desktop window of its own.
[[example]]
name = "rerender"
required-features = ["webview"]

# Which frontend draws the window. Exactly one: `lib.rs` refuses to build with neither or both.
# Only the window's launch and its host seam depend on the choice; the data side and the CLI are
# the same code under either.
[features]
default = ["webview"]
# Dioxus desktop, a WebKitGTK webview: the window as it has always been, and the default until
# the composer runs on Blitz.
webview = ["dioxus/desktop", "ds/webview-fonts", "dep:webkit2gtk"]
# quire's `ds-native`: Blitz, drawn with wgpu. `--no-default-features --features native`.
native = ["dep:ds-native", "dep:blitz-dom", "dep:dioxus-native-dom"]

[dependencies]
latchkey.workspace = true
mail-domain.workspace = true
mail-store.workspace = true
mail-mime.workspace = true
mail-proto.workspace = true
mail-pim.workspace = true
mail-runtime.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json = "1"
# `sync` for the channel the Original frame's image fetches reach their worker through
# (`ui/original/net.rs`); already in the tree through reqwest and ds-native.
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
# For `join_all` only: one pass over several accounts is several independent conversations with
# several servers, and running them one after another spends the sum of their waiting.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
chrono.workspace = true
# The renderer is a feature's: `webview` adds `desktop`; `native` draws through `ds-native`.
dioxus = { version = "0.7" }
# quire, the shared design system (github.com/PoHsuanLai/quire), pinned to a release tag.
# `lint` is for the stylesheet and markup tests; the `webview` feature adds `webview-fonts`, the
# `@font-face` rules as `data:` URIs, which only a webview needs. To try an unreleased quire,
# point every quire line at a checkout with a `[patch]` in a local, uncommitted
# `.cargo/config.toml`, never here.
ds = { git = "https://github.com/PoHsuanLai/quire", tag = "v0.1.9", features = ["lint"] }
# Settings I/O: `appearance.toml` (imported once from `appearance.json`), the settings portal.
ds-settings = { git = "https://github.com/PoHsuanLai/quire", tag = "v0.1.9" }
# The `native` frontend: quire's Blitz host (the window, its fonts, focus, clipboard, harness).
ds-native = { git = "https://github.com/PoHsuanLai/quire", tag = "v0.1.9", optional = true }
blitz-dom = { workspace = true, optional = true }
dioxus-native-dom = { workspace = true, optional = true }
# ASCII-case-insensitive multi-pattern search for highlights. Already in the tree via `regex`.
aho-corasick = "1.1"
# `re:/pattern/`. Already in the tree; depended on directly so the size caps are ours.
regex = "1"
# fzf-style fuzzy match for the menu's small sets. See `search/fuzzy.rs` for why this one.
nucleo-matcher = "0.3"
# Provider icons. Already in the lock through dioxus-desktop; only these two formats are decoded.
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
base64 = "0.22"
thiserror.workspace = true
# Grapheme clusters for caret movement and backspace. Unicode Standard Annex #29.
unicode-segmentation = "1.13"
# The registered domain of a host, for the sender card's brand check and the link pill. Chosen
# over `publicsuffix`, which needs the list shipped and parsed at run time; this one compiles the
# list in, so a check needs no file and no I/O. MIT/Apache-2.0, with one dependency, `psl-types`.
psl = "2"
# Already a dependency of every id type. Named here because `mailo unsubscribe` takes an id that
# may be a message or a thread, and only the store can say which.
uuid = { workspace = true }
# Desktop notifications for new mail (`notify/desktop.rs`): the freedesktop interface on the
# session bus. Already in the lock through the keyring's Secret Service store, with these features.
zbus = "5"
# The native file dialog beside the Import and Export sheets' typed path. Already in the lock
# through dioxus-desktop, at this version and with exactly these features (the desktop portal).
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
# Opens a browser sign-in's address from the Add account sheet. Already in the lock through
# dioxus-desktop, at this version and with its default (empty) features. MIT OR Apache-2.0.
webbrowser = "=1.2.4"
# `mailo contacts sync` takes a URL and hands it to the CardDAV client, which speaks `url`.
url = "2"
# A typed password is overwritten when it is dropped (`password.rs`). Already in the lock through
# rustls and the keyring.
zeroize = "1"
# The OS random number generator for OpenPGP key generation and sealing (`pgp/`) and S/MIME
# sealing (`smime/`). rPGP's own `rand` generation; already in the tree. For every target: it had
# been listed under Linux alone, where `pgp/` would not have built anywhere else.
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
# Printing: the print operation over the printed document's own webview, made here rather than
# through `wry`'s `print()` because only the operation's `finished` signal says when that window
# may close (`ui/print/window.rs`). Already in the lock through wry, at the version wry uses.
# The `webview` feature's alone: on `native`, Print says it is not there yet.
webkit2gtk = { version = "2.0", optional = true }

[dev-dependencies]
tempfile = "3"
# The throwaway certificate authority `tests/smime.rs` builds its fixtures with
# (`mail-mime/tests/smime_support`). All already in the tree through `mail-mime`.
x509-cert = { version = "0.2", features = ["builder"] }
der = "0.7"
spki = "0.7"
const-oid = "0.9"
cms = "0.2"
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }
# A paused clock, so a test drives the search box's debounce instead of sleeping through it.
tokio = { version = "1", features = ["test-util"] }
dioxus-ssr = "0.7"
uuid = { workspace = true }
proptest = "1"

[lints]
workspace = true
