[package]
name = "mail-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mail_app"
path = "src/lib.rs"

[[bin]]
name = "mailo"
path = "src/main.rs"

[dependencies]
latchkey.workspace = true
mail-domain.workspace = true
mail-store.workspace = true
mail-mime.workspace = true
mail-proto.workspace = true
mail-runtime.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
# For `join_all` only: one pass over several accounts is several independent conversations with
# several servers, and running them one after another spends the sum of their waiting.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
chrono.workspace = true
dioxus = { version = "0.7", features = ["desktop"] }
# ASCII-case-insensitive multi-pattern search for highlights. Already in the tree via `regex`.
aho-corasick = "1.1"
# `re:/pattern/`. Already in the tree; depended on directly so the size caps are ours.
regex = "1"
# fzf-style fuzzy match for the menu's small sets. See `search/fuzzy.rs` for why this one.
nucleo-matcher = "0.3"
# Provider icons. Already in the lock through dioxus-desktop; only these two formats are decoded.
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
base64 = "0.22"
thiserror.workspace = true
# Grapheme clusters for caret movement and backspace. Unicode Standard Annex #29.
unicode-segmentation = "1.13"

[dev-dependencies]
tempfile = "3"
dioxus-ssr = "0.7"
uuid = { workspace = true }
proptest = "1"

[lints]
workspace = true
