[package]
name = "mailo-reader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "How a received message becomes what is read: untrusted HTML sanitized and lowered to blocks, plain text read, quoted tails folded, and the printed page. No I/O."
readme = "README.md"
keywords = ["email", "sanitize", "html", "reader"]
categories = ["email", "text-processing"]

# Published as mailo-reader; used in code as `mail_reader`, as the workspace always has.
[lib]
name = "mail_reader"

[dependencies]
mail-domain.workspace = true
mail-mime.workspace = true
chrono.workspace = true
ammonia = "4"
# The tokenizer ammonia and the renderer already use: the reader frame's kept CSS is read with it.
cssparser = "0.38"
base64 = "0.22"
# Already here through ammonia. Parses the URLs in a message's links and images, which are untrusted.
url = "2"
# Pinned to ammonia 4.2's own html5ever, deliberately: the block parser reads the sanitizer's
# output, so it must tokenize it with the same parser that produced it. If an ammonia bump
# moves this, move this line in the same commit.
html5ever = "0.40"

[dev-dependencies]
proptest = "1"
# The values a test starts from (`mail_domain::testing`): the program never has them.
mail-domain = { workspace = true, features = ["testing"] }

[lints]
workspace = true
