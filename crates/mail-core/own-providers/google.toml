# Gmail, as mailo reads it: mail over IMAP and SMTP with XOAUTH2 (the sign-in's
# `mail.google.com` scope), signed in with Google's OAuth issuer.
#
# This file is mailo's, not porter's. porter's `google.toml` is the Google family (calendar,
# contacts, tasks, files, photos), and its mail row is for a person's own OAuth client only, with
# IMAP and no SMTP. mailo's sign-in and send need both, so this file has porter's id and replaces
# porter's in mailo's set, the way a user's file does (`ProviderSet::layered`). It claims what
# mailo's preset table claimed before it moved (`gmail.com` and `googlemail.com` by domain, and a
# domain whose MX host is under `google.com`, `googlemail.com` or `gmail.com` by MX), and goes when
# porter's covers mailo's mail.
id = "google"
label = "Google"
mark = "google"

[auth]
kind = "oauth_pkce"
issuer = "google"

[discovery]
kind = "fixed"

[matching]
domains = ["gmail.com", "googlemail.com"]
mx_suffixes = ["google.com", "googlemail.com", "gmail.com"]

[[capability]]
family = "imap"
endpoint = "imaps://imap.gmail.com:993"
kind = "mail"
v = { access = "read_write", send = "present", delta = "push", transport = "imap", labels = "labels" }

[[capability]]
family = "smtp"
endpoint = "smtps://smtp.gmail.com:465"
kind = "mail"
v = { access = "read_write", send = "present", delta = "push", transport = "imap", labels = "labels" }
