[package]
name = "mail-edge"
# The app side: I/O and policy, not a library for others.
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The process's one runtime, environment, Profile and OAuth clients, and the mail-core handle built from them"
repository = "https://github.com/PoHsuanLai/mailo"
authors = ["Po Hsuan Lai <pohsuanlai0208@gmail.com>"]

# What `main` records once and the command line, the intents provider and the window then read.
# Below all three and naming none of them: no `mail-ui`, no dioxus, no ds-* (`scripts/check-boundary.sh`).

[dependencies]
mail-core = { workspace = true, features = ["keyring"] }
mail-store.workspace = true
# `rt-multi-thread` for the application's one runtime, which the libraries are handed.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
mail-store = { workspace = true, features = ["testing"] }
tempfile = "3"

[lints]
workspace = true
