[package]
name = "mail-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
porter-core.workspace = true
porter-provider.workspace = true
porter-discover.workspace = true
porter-http.workspace = true
porter-oauth = { workspace = true, features = ["io"] }
# The link to the desktop's accountd (`link/`, step E6). Without the `dbus` feature this is
# porter's client over the in-process transport and the relay's byte streams: no zbus.
porter-client.workspace = true
# The trait the account secrets are filed through. The stores behind it are the `keyring` feature's.
porter-secrets.workspace = true
mail-domain.workspace = true
mail-proto.workspace = true
mail-store.workspace = true
# The OpenPGP and S/MIME halves are features of the library; this crate uses both.
mail-mime = { workspace = true, features = ["openpgp", "smime"] }
mail-pim.workspace = true
chrono.workspace = true
thiserror.workspace = true
log.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = "0.26"
# TCP keepalive on the sockets this crate opens (`transport.rs`): tokio has no setter for it.
# MIT OR Apache-2.0, already in the tree through tokio, at its version.
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-pki-types = "1"
blake3 = "1"
# The PKCE verifier and state of a sign-in (porter-oauth takes its randomness as arguments).
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
# CardDAV through accountd's relay (`carddav/relay.rs`, step E7): reqwest has no connector for a
# stream it is handed, so the relayed requests go through hyper's own client over that stream. The
# same hyper reqwest already uses; only the client connection and the tokio adapter are named.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
url = "2"
base64 = "0.22"
serde = { workspace = true }
serde_json = "1"
uuid = { workspace = true }
# The keyring's common API, with no store of its own; each platform's store is named below, under
# its target. It serves the signing keys mailo keeps in its own store (`signing_store.rs`), which
# are not account secrets: those go through porter-secrets.
keyring-core = "1"
# The system resolver, for `porter_discover::Dns` (SRV and MX, RFC 6186) and BIMI's TXT lookups
# (`lookup.rs`). MIT OR Apache-2.0; the system resolver's configuration, over tokio. Its
# DNS-over-TLS/HTTPS features stay off.
hickory-resolver = "0.26"
# The registered domain of a host, for BIMI's organisational domain.
psl = "2"
# Brand logos (`bimi/`): an SVG drawn to pixels off the thread that draws the window. resvg
# (Apache-2.0 OR MIT) over the usvg and tiny-skia already in the tree through Blitz. Default
# features off: no system fonts, no raster images, so a logo can load nothing but itself.
resvg = { version = "0.48", default-features = false }
# The logo's cache key. Already here through S/MIME.
sha2 = "0.10"
# A logo read as XML before it is drawn, to refuse what SVG Tiny PS leaves out. The parser usvg
# already uses, at its version; it expands no entities and reads no DTD.
roxmltree = "0.21"
# The operating system's certificate authorities, as S/MIME trust anchors (`smime.rs`). Apache-2.0
# OR ISC OR MIT; reads the platform's bundle (on Linux the files OpenSSL would, found by
# `openssl-probe`, also permissive).
rustls-native-certs = "0.8"
# An S/MIME private key on its way to and from the keyring is wiped after. Already in the tree.
zeroize = "1"

# Where secrets are kept, per platform, behind the `keyring` and `oo7` features. All MIT OR
# Apache-2.0.
#
# Account secrets (porter-secrets, `account_secrets.rs`): on Linux `Oo7Secrets`, the Secret Service
# through oo7 and no daemon of ours (the `oo7` feature); on macOS and Windows `KeyringSecrets`, the
# login keychain and the Credential Manager, which chunks what the Credential Manager cannot hold
# (the `keyring` feature). One store per platform, chosen in `account_secrets.rs` and nowhere else.
[target.'cfg(target_os = "linux")'.dependencies]
# Desktop extras (design/36 rule 3): the bus's own vocabulary, for the signals accountd sends
# (`link/dbus.rs`). Only on Linux and only with `quire-desktop`.
porter-dbus = { workspace = true, optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

# The signing keys (`signing_store.rs`), over
# keyring-core, at the features `keyring` 4 chose on each.
#
# Linux and the BSDs: the Secret Service (GNOME Keyring, KWallet, KeePassXC) over zbus.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"], optional = true }

# macOS: the login keychain.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"], optional = true }
# The per-user directories macOS and Windows name (`places.rs`). Linux keeps the XDG rule it has
# always followed, spelled out there, so the directories it already uses cannot move.
dirs = "6"

# Windows: the Credential Manager. Its entries hold at most 2560 bytes, which a Microsoft token
# or a signing key outgrows; `signing_store/chunks.rs` is why that does not matter there.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", optional = true }
dirs = "6"

[features]
# Nothing is on by default: a headless or third-party user of this crate pays for what it names.
# `mail-app` names `keyring` and `quire-desktop`, so the shipped binary has both.
default = []
# Desktop extras, additive and lit by capability: the link to accountd over D-Bus. A build for
# another desktop, and the portable gate (`cargo check --workspace --no-default-features`), has the
# in-process path alone. The code is also `cfg(target_os = "linux")`. Cargo cannot say "on for
# Linux" (a feature is on or off for the whole build), so the macOS and Windows jobs in CI leave it
# off, which keeps zbus and porter's D-Bus transport out of those builds.
quire-desktop = ["porter-client/dbus", "dep:porter-dbus", "dep:futures-util"]
# The platform's keyrings (the Secret Service over zbus on Linux and the BSDs, the login keychain on
# macOS, the Credential Manager on Windows): `KeyringSigningStore` over them, and on macOS and
# Windows `PlatformSecrets`. Without it they are present but empty, answering every call as
# unavailable, and a caller keeps its secrets in an `AccountSecrets` and a `SigningStore` of its own.
keyring = [
    "porter-secrets/keyring",
    "dep:zbus-secret-service-keyring-store",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
]
# Linux: the account secrets in the Secret Service through oo7 (`Oo7Secrets`). Its own feature
# because macOS and Windows have no use for oo7 or the bus it brings; `mail-app` names it under
# `cfg(target_os = "linux")`. Without it, on Linux, `PlatformSecrets` holds nothing.
oo7 = ["porter-secrets/oo7"]
# What a test swaps in at this crate's seams (`testing`): an in-memory transport, account secrets
# and signing store, and accountd as a table. Off in the program.
testing = ["porter-secrets/testing"]

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The bus of its own the link's tests run on (`tests/runtime/link_bus.rs`): the same zbus the secret store
# and the intents provider already bring.
zbus = "5.19"

[dev-dependencies]
# Seeding a store without writing SQL (`mail_store::testing`): the program never has it.
mail-store = { workspace = true, features = ["testing"] }
# Its own tests use the doubles it exports.
mail-runtime = { path = ".", features = ["testing"] }
porter-proxy.workspace = true
porter-secrets = { workspace = true, features = ["testing", "keyring"] }
# `test-util` for the tests that wait out a deadline on a paused clock (`tests/runtime/drive.rs`).
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
# The WKD hash the OpenPGP tests check a request path by, already in the tree through rPGP.
sha1 = "0.10"
# The throwaway mark verifying authority `tests/runtime/bimi.rs` builds its certificates with
# (`mail-mime/tests/bimi_support`). All already in the tree through `mail-mime`.
x509-cert = { version = "0.2", features = ["builder"] }
der = "0.7"
spki = "0.7"
const-oid = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }

[lints]
workspace = true
