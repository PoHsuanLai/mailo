[package]
name = "mail-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mail-domain.workspace = true
mail-proto.workspace = true
mail-store.workspace = true
mail-mime.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-pki-types = "1"
blake3 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
# default-features off: oauth2 would otherwise pull its own reqwest and make the HTTP call
# itself. We want the call here, where the runtime already owns TLS and timeouts.
oauth2 = { version = "5", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
url = "2"
base64 = "0.22"
serde = { workspace = true }
serde_json = "1"
uuid = { workspace = true }
keyring = "4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[lints]
workspace = true
