[workspace]
resolver = "3"
members = [
  "crates/mail-domain",
  "crates/mail-mime",
  "crates/mail-crypto",
  "crates/mail-archive",
  "crates/mail-proto",
  "crates/mail-pim",
  "crates/mail-editor",
  "crates/mail-reader",
  "crates/mail-store",
  "crates/mail-runtime",
  "crates/mail-core",
  "crates/mail-client",
  "crates/mail-appkit",
  "crates/mail-os",
  "crates/mail-edge",
  "crates/mail-ui",
  "crates/mail-cli",
  "crates/mail-intents",
  "crates/mail-app",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Po Hsuan Lai"]
repository = "https://github.com/PoHsuanLai/mailo"
homepage = "https://github.com/PoHsuanLai/mailo"
# 1.85 is what the 2024 edition needs; 1.89 is what `std::fs::File::try_lock` needs, and the
# daemon's "one per user" rule is built on it (`mail_app::ipc::bind`). The alternative was a
# dependency — `fs4` or `rustix` — for a two-line call that std now has, on a release from
# August 2025. 1.91 is what quire, the design system `mail-app` draws with, declares. Raised
# deliberately rather than by drift.
rust-version = "1.92"

[workspace.dependencies]
# The per-user agent lifecycle, its own repo since 2026-10-07 (split from crates/latchkey here).
latchkey    = { git = "https://github.com/PoHsuanLai/latchkey", rev = "b10ae1b8c49c55cce2c5affde8f5db76edb66ab4" }
mail-appkit = { path = "crates/mail-appkit" }
mail-client = { path = "crates/mail-client" }
mail-os = { path = "crates/mail-os" }
mail-ui = { path = "crates/mail-ui" }
mail-edge = { path = "crates/mail-edge" }
mail-cli = { path = "crates/mail-cli" }
mail-intents = { path = "crates/mail-intents" }
mail-core   = { path = "crates/mail-core", default-features = false }
mail-domain = { package = "mailo-domain", path = "crates/mail-domain", version = "0.1.0" }
mail-archive = { package = "mailo-archive", path = "crates/mail-archive", version = "0.1.0" }
mail-crypto = { package = "mailo-crypto", path = "crates/mail-crypto", version = "0.1.0", default-features = false }
mail-mime   = { package = "mailo-mime", path = "crates/mail-mime", version = "0.1.0", default-features = false }
mail-pim    = { package = "mailo-pim", path = "crates/mail-pim", version = "0.1.0" }
mail-editor = { package = "mailo-editor", path = "crates/mail-editor", version = "0.1.0" }
mail-reader = { package = "mailo-reader", path = "crates/mail-reader", version = "0.1.0" }
mail-proto  = { package = "mailo-proto", path = "crates/mail-proto", version = "0.1.0" }
mail-runtime = { path = "crates/mail-runtime", default-features = false }
mail-store  = { path = "crates/mail-store" }
# The accounts system's vocabulary, pinned by git rev like quire (porter is public). mailo names its
# accounts, their secrets and their OAuth issuers with porter's types instead of its own, so the
# desktop's accounts daemon and mailo agree on what an account is.
# porter-core and porter-provider are pure (serde, serde_json, thiserror, toml): no zbus and no
# tokio, so the macOS and Windows builds are unaffected.
#
# porter-secrets is where account secrets live. Its stores are features, chosen per
# target in mail-runtime's own Cargo.toml: `oo7` on Linux, `keyring` on macOS and Windows. It
# enters mail-runtime, the I/O crate, and no pure crate: mail-domain, -mime, -crypto, -archive, -proto and -pim
# stay free of zbus and tokio (`scripts/check-boundary.sh`).
porter-core = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-provider = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-secrets = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709", default-features = false }
# Discovery. porter-discover without its `io` feature is pure parsers and two seams (no
# tokio, no hickory); mail-runtime implements `porter_discover::Dns` and `porter_http::Http` over
# the resolver and the HTTP client mailo already has, so neither dependency is added for them.
porter-discover = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709", default-features = false }
# OAuth. Without its `io` feature porter-oauth is the rules, the registry and the exchanges
# over `porter_http::Http` (no tokio); only mail-runtime, the I/O crate, turns `io` on, for the
# loopback listener.
porter-oauth = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709", default-features = false }
porter-http = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709", default-features = false }
# The values that name nothing of accounts (units, `WebUrl`, the clock seam), the capability
# vocabulary (`CapabilityKind`, `Toggle`, the offers) and the add-account sheet's machine and the
# wire an app speaks to the service, each split out of porter-core: every caller names them directly.
porter-ids = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-capability = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-sheet = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-wire = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
# `ReqwestHttp`, the one direct-connection client behind `porter_http::Http`.
porter-http-reqwest = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
# WebDAV, CalDAV and CardDAV as text with no I/O (request bodies, multistatus replies), from porter,
# and the Windows time zone names to IANA ones, from ferry: used here by the pure `mail-pim`.
dav-proto = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
windows-zones = { git = "https://github.com/PoHsuanLai/ferry", rev = "e61b2648d8c455b6b36612aece7f51a6dd5ff96c" }
# A keyring-core store that keeps a value too long for one entry in several (the Windows
# Credential Manager's 2560 bytes): the signing keys' store in `mail-runtime`.
keyring-chunked = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
# porter-client is the app-facing API: the relay's byte stream `mail-runtime`'s transport can wrap.
# porter-client-inproc is its in-process transport: the add-account window hosts porter's account
# service and draws its sheet. Neither brings in zbus: mailo keeps its own accounts and credentials.
porter-client = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-client-inproc = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
serde       = { version = "1", features = ["derive"] }
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1", features = ["v4", "serde"] }
thiserror   = "2"
# The logging facade the libraries write diagnostics through; mail-app installs the one logger.
log         = "0.4"
# From quire's pinned block (`docs/workspace-deps.toml` at the tag `mail-app`'s `ds` names),
# copied verbatim: only the lines mailo names itself. The window reaches the Blitz
# document through these to focus, select or scroll an element found by selector
# (`ui/host/native.rs`).
#
# `floats` is mailo's own, past quire's block: Blitz marks a floated element for the float layout
# whether or not that layout is built, and without it the line breaker handed a paragraph holding
# one (a newsletter's `<img align="left">`) loops for ever. Features unify, so naming it here turns
# it on for the one blitz-dom every crate shares (`lanes/floats.rs`).
blitz-dom = { git = "https://github.com/PoHsuanLai/blitz", rev = "841386a71f17673c211217725e75068774517ba8", default-features = false, features = ["svg", "system-fonts", "custom-widget", "accessibility", "floats"] }
dioxus-native-dom = { git = "https://github.com/PoHsuanLai/blitz", rev = "841386a71f17673c211217725e75068774517ba8", default-features = false, features = ["svg", "system-fonts", "accessibility"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "allow"

# The release `mailo` carries Blitz, stylo, wgpu and parley, and at cargo's defaults it is ~107 MB.
# Measured on one machine (Apple M-series, `--no-default-features` as the packages build it,
# stripped; sizes of `target/release/mailo`, times of a clean release build):
#
#   lto = "thin", opt-level = "s"                         86 MB   ~194 s
#   + codegen-units = 1                                   75 MB   ~174 s
#   lto = "fat", codegen-units = 1, opt-level = "s"       54 MB   ~478 s   <- this
#   lto = "fat", codegen-units = 1, opt-level = "z"       40 MB   ~357 s
#
# Fat LTO over one unit lets the linker see the whole program and drop what no caller reaches,
# which thin LTO across sixteen units cannot; what it costs is build time. "z" was measured
# against "s" with `native_latency` and `frame_budget` (fat, one unit, alternating runs): "z"
# triples the CPU paint (3 ms to 10.5 ms a frame), takes `j` from 12.7 to 18.6 ms and the launch
# to the first list from 26 to 56 ms, and doubles the composer's work per key. 14 MB is not worth
# that. For a quick local release build, pass
# `--config 'profile.release.lto="thin"' --config profile.release.codegen-units=16`.
#
# Symbols go, so a release panic's backtrace has addresses but no names: build with
# `--config profile.release.strip=false` to read one. `panic` stays `unwind`: a panicking Tokio
# task or `spawn_blocking` must fail alone, not take the window with it, and the preview of an
# attachment catches a decoder's panic on hostile bytes (`mail_core::preview`).
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = "s"

# Dependencies keep line tables (a backtrace still names file and line) but not full debuginfo;
# the workspace's own crates keep everything, so stepping through mailo is unchanged. With full
# debuginfo everywhere a cold `cargo clippy` + `cargo test --workspace` target dir was ~49 GB;
# with this it is ~25 GB, and the cold test build went from ~108 s to ~80 s on the same machine.
[profile.dev.package."*"]
debug = "line-tables-only"

# The reader parses every message body into blocks when it opens a thread: html5ever tokenizes,
# mail-mime walks. Unoptimised, that walk spent most of `reader_scale`'s budget (five 2 MB bodies
# took ~425 ms against 500) and made a debug window slow on large mail. With these built optimised
# even in dev it is ~170 ms. mail-mime is pure bytes-in, values-out and has its own tests, so
# losing step-through debugging there is the cheaper trade; the crates that do I/O and the UI stay
# at the dev default.
[profile.dev.package.html5ever]
opt-level = 2

[profile.dev.package.markup5ever]
opt-level = 2

[profile.dev.package.tendril]
opt-level = 2

[profile.dev.package.ammonia]
opt-level = 2

[profile.dev.package.mailo-mime]
opt-level = 2

[profile.dev.package.mailo-crypto]
opt-level = 2

# S/MIME (`mail-crypto::smime`) generates RSA keys in its tests and derives PKCS#12 keys with
# 100 000 rounds of SHA-256. Unoptimised, a 2048-bit key takes tens of seconds and a PKCS#12 file
# several; built optimised even in dev, a fraction of a second. Pure arithmetic crates with their
# own tests, so nothing is lost by not stepping through them.
[profile.dev.package.num-bigint-dig]
opt-level = 2

[profile.dev.package.rsa]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.sha1]
opt-level = 2

[profile.dev.package.pkcs5]
opt-level = 2

[profile.dev.package.pbkdf2]
opt-level = 2

# vello and anyrender come from quire's forks (github.com/PoHsuanLai/vello and /anyrender, branch
# quire-filters), and dioxus-core from its dioxus fork: quire's canonical fork block
# (`docs/fork-patches.toml` at the rev `ds` is pinned to), pasted whole, since a `[patch]` applies
# only at a workspace root and mailo builds the renderer (`ds-blitz`). Change it only by pasting
# that file again; `scripts/check-fork-patches.sh` fails CI when the two differ.
[patch.crates-io]
vello_common = { git = "https://github.com/PoHsuanLai/vello", rev = "5c986661c9e943d26dac8e8ea7812895947722b8" }
vello_cpu = { git = "https://github.com/PoHsuanLai/vello", rev = "5c986661c9e943d26dac8e8ea7812895947722b8" }
vello_hybrid = { git = "https://github.com/PoHsuanLai/vello", rev = "5c986661c9e943d26dac8e8ea7812895947722b8" }
vello_sparse_shaders = { git = "https://github.com/PoHsuanLai/vello", rev = "5c986661c9e943d26dac8e8ea7812895947722b8" }
glifo = { git = "https://github.com/PoHsuanLai/vello", rev = "5c986661c9e943d26dac8e8ea7812895947722b8" }
anyrender = { git = "https://github.com/PoHsuanLai/anyrender", rev = "03fcbe4c746d2334d3fb91e63641741f3dacc826" }
anyrender_vello_cpu = { git = "https://github.com/PoHsuanLai/anyrender", rev = "03fcbe4c746d2334d3fb91e63641741f3dacc826" }
anyrender_vello_hybrid = { git = "https://github.com/PoHsuanLai/anyrender", rev = "03fcbe4c746d2334d3fb91e63641741f3dacc826" }
wgpu_context = { git = "https://github.com/PoHsuanLai/anyrender", rev = "03fcbe4c746d2334d3fb91e63641741f3dacc826" }
pixels_window_renderer = { git = "https://github.com/PoHsuanLai/anyrender", rev = "03fcbe4c746d2334d3fb91e63641741f3dacc826" }
# dioxus-core 0.7.10 can spin forever in VirtualDom::wait_for_work: a task woken and then cancelled
# before it is polled (a use_resource restart) leaves an empty entry in the dirty-task queue that
# pop_task never removes. Fixed upstream in DioxusLabs/dioxus#5554 (0.8-alpha only); this fork
# (github.com/PoHsuanLai/dioxus, branch quire-0.7) backports it onto 0.7.10. Remove when quire
# moves to dioxus 0.8.
dioxus-core = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
dioxus-core-types = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
generational-box = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond-types = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
