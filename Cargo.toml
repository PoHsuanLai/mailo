[workspace]
resolver = "3"
members = [
  "crates/mail-domain",
  "crates/mail-mime",
  "crates/mail-proto",
  "crates/mail-pim",
  "crates/mail-store",
  "crates/mail-runtime",
  "crates/mail-app",
  "crates/latchkey",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
# 1.85 is what the 2024 edition needs; 1.89 is what `std::fs::File::try_lock` needs, and the
# daemon's "one per user" rule is built on it (`mail_app::ipc::bind`). The alternative was a
# dependency — `fs4` or `rustix` — for a two-line call that std now has, on a release from
# August 2025. 1.91 is what quire, the design system `mail-app` draws with, declares. Raised
# deliberately rather than by drift.
rust-version = "1.92"

[workspace.dependencies]
latchkey    = { path = "crates/latchkey" }
mail-domain = { path = "crates/mail-domain" }
mail-mime   = { path = "crates/mail-mime" }
mail-pim    = { path = "crates/mail-pim" }
mail-proto  = { path = "crates/mail-proto" }
mail-runtime = { path = "crates/mail-runtime" }
mail-store  = { path = "crates/mail-store" }
serde       = { version = "1", features = ["derive"] }
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1", features = ["v4", "serde"] }
thiserror   = "2"
# From quire's pinned block (`docs/workspace-deps.toml` at the tag `mail-app`'s `ds` names),
# copied verbatim: only the lines mailo names itself. The `native` frontend reaches the Blitz
# document through these to focus, select or scroll an element found by selector
# (`ui/host/native.rs`).
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "e99fbdbd1d03b9f0aa1622c3f810d95daac92042", default-features = false, features = ["svg", "system-fonts", "custom-widget", "accessibility"] }
dioxus-native-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "e99fbdbd1d03b9f0aa1622c3f810d95daac92042", default-features = false, features = ["svg", "system-fonts", "accessibility"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "allow"

# The reader parses every message body into blocks when it opens a thread: html5ever tokenizes,
# mail-mime walks. Unoptimised, that walk spent most of `reader_scale`'s budget (five 2 MB bodies
# took ~425 ms against 500) and made a debug window slow on large mail. With these built optimised
# even in dev it is ~170 ms. mail-mime is pure bytes-in, values-out and has its own tests, so
# losing step-through debugging there is the cheaper trade; the crates that do I/O and the UI stay
# at the dev default.
[profile.dev.package.html5ever]
opt-level = 2

[profile.dev.package.markup5ever]
opt-level = 2

[profile.dev.package.tendril]
opt-level = 2

[profile.dev.package.ammonia]
opt-level = 2

[profile.dev.package.mail-mime]
opt-level = 2

# S/MIME (`mail-mime::smime`) generates RSA keys in its tests and derives PKCS#12 keys with
# 100 000 rounds of SHA-256. Unoptimised, a 2048-bit key takes tens of seconds and a PKCS#12 file
# several; built optimised even in dev, a fraction of a second. Pure arithmetic crates with their
# own tests, so nothing is lost by not stepping through them.
[profile.dev.package.num-bigint-dig]
opt-level = 2

[profile.dev.package.rsa]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.sha1]
opt-level = 2

[profile.dev.package.pkcs5]
opt-level = 2

[profile.dev.package.pbkdf2]
opt-level = 2
