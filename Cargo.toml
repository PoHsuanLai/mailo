[workspace]
resolver = "3"
members = [
  "crates/mail-domain",
  "crates/mail-mime",
  "crates/mail-proto",
  "crates/mail-store",
  "crates/mail-runtime",
  "crates/mail-app",
  "crates/latchkey",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
# 1.85 is what the 2024 edition needs; 1.89 is what `std::fs::File::try_lock` needs, and the
# daemon's "one per user" rule is built on it (`mail_app::ipc::bind`). The alternative was a
# dependency — `fs4` or `rustix` — for a two-line call that std now has, on a release from
# August 2025. Raised deliberately rather than by drift.
rust-version = "1.89"

[workspace.dependencies]
latchkey    = { path = "crates/latchkey" }
mail-domain = { path = "crates/mail-domain" }
mail-mime   = { path = "crates/mail-mime" }
mail-proto  = { path = "crates/mail-proto" }
mail-runtime = { path = "crates/mail-runtime" }
mail-store  = { path = "crates/mail-store" }
serde       = { version = "1", features = ["derive"] }
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1", features = ["v4", "serde"] }
thiserror   = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "allow"
