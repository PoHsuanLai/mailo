name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A failure that only shows up in a release build is a failure nobody sees until it ships,
  # but debug builds of this workspace are large; this keeps the cache useful without the size.
  CARGO_INCREMENTAL: 0
  # Line tables only, for the workspace's own crates too (Cargo.toml already does this for
  # dependencies): a failing test's backtrace still names file and line, and a cold target dir for
  # clippy plus the tests is ~19 GB rather than ~25 GB, which is disk a hosted runner has and
  # cache it restores faster.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # The gates that need no servers and no window. Everything here must pass for every push.
  check:
    runs-on: ubuntu-latest
    # Every job here has a timeout, because the default is six hours and a deadlocked test does
    # not fail — it waits. A hung `portable` job burnt an hour and forty minutes of a Windows
    # runner before anyone looked; a limit turns that into a red cross in a known time.
    #
    # Cold (no cache), this job builds Blitz, stylo, wgpu and parley twice, for clippy and for
    # the tests. Measured with a clean target dir: clippy ~570 CPU-seconds, the test build ~1400,
    # the test run ~80 s of wall time (the headless window suite waits on its own clock). On a
    # four-core runner that is ~15-18 minutes with setup; 40 leaves room for a slow runner and a
    # cache miss without letting a hang run for long.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The window is quire's `ds-native` (Blitz, wgpu), and the one system library that stack
      # links at build time is fontconfig (parley's font discovery, `yeslogic-fontconfig-sys`).
      # Wayland, X11 and xkbcommon are opened at run time, and wgpu finds its drivers the same
      # way, so the tests that drive the window headlessly (`tests/native_harness.rs`) need no GPU
      # and no display.
      - name: System libraries for the window
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Saved even when a step fails, so a cold run that ends red still leaves the dependencies
      # built for the next one instead of paying for Blitz again.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Formatting
        run: cargo fmt --all --check

      # `-D warnings` here rather than in `RUSTFLAGS`: that variable applies to dependencies
      # too, so a warning in somebody else's crate would fail this build for a reason nobody
      # here can fix.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No network: everything that talks to a socket is `#[ignore]`d and runs in `live` below.
      # The window is driven headlessly among them.
      - name: Tests
        run: cargo test --workspace

      # The rule the whole design rests on: the three pure crates must not be able to reach an
      # I/O dependency. It is checked mechanically because a person reading Cargo.toml will not
      # notice a transitive edge.
      - name: The sans-I/O boundary
        run: ./scripts/check-boundary.sh

  # Real sockets, against servers this repository did not write: a Twisted IMAP4Server, an
  # aiosmtpd SMTP server, and a POP3 server. Separate from `check` because it needs Python and a
  # few seconds of setup, and because a failure here means something different — the protocol
  # met a real implementation and disagreed with it.
  live:
    runs-on: ubuntu-latest
    # `sync_path` is a mail-app test, so a cold run here builds the window stack too (~8-10
    # minutes on a four-core runner) before any socket opens.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the window
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Local servers only. `--network` would also run the CAPA probe against a real server,
      # which is someone else's machine and not something CI should reach for on every push.
      - name: Live protocol tests
        run: ./scripts/live-tests.sh

  # The one crate here that claims to be cross-platform, built and tested where it claims to
  # work. `latchkey` decides where a per-user agent lives on macOS and Windows, and a claim like
  # that checked only on Linux is a claim rather than a fact — its rules are pure functions and
  # tested everywhere, but the lock and the named pipe are the kernel's and have to be met.
  #
  # Only this crate: the rest of the workspace is Linux-only on purpose.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Tighter than the rest. This is the job that hung, the suite is small, and a Windows runner
    # is the most expensive minute in this file.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test -p latchkey
      - name: Clippy
        run: cargo clippy -p latchkey --all-targets -- -D warnings

  # Dependency licences. The allow-list in deny.toml is the machine-readable half of
  # docs/licensing-references.md: a dependency whose licence is not on it fails here rather than
  # being noticed later by somebody reading Cargo.lock.
  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
