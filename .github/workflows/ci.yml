name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A failure that only shows up in a release build is a failure nobody sees until it ships,
  # but debug builds of this workspace are large; this keeps the cache useful without the size.
  CARGO_INCREMENTAL: 0

jobs:
  # The gates that need no servers and no window. Everything here must pass for every push.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `mail-app` links against webkit2gtk for the desktop window, so even `cargo test` needs
      # it present — the window is not built here, but the crate does not compile without it.
      - name: System libraries for the desktop window
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # `-D warnings` here rather than in `RUSTFLAGS`: that variable applies to dependencies
      # too, so a warning in somebody else's crate would fail this build for a reason nobody
      # here can fix.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # No network: everything that talks to a socket is `#[ignore]`d and runs in `live` below.
      - name: Tests
        run: cargo test --workspace

      # The rule the whole design rests on: the three pure crates must not be able to reach an
      # I/O dependency. It is checked mechanically because a person reading Cargo.toml will not
      # notice a transitive edge.
      - name: The sans-I/O boundary
        run: ./scripts/check-boundary.sh

  # Real sockets, against servers this repository did not write: a Twisted IMAP4Server, an
  # aiosmtpd SMTP server, and a POP3 server. Separate from `check` because it needs Python and a
  # few seconds of setup, and because a failure here means something different — the protocol
  # met a real implementation and disagreed with it.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the desktop window
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Local servers only. `--network` would also run the probe against NTU's public server,
      # which is someone else's machine and not something CI should reach for on every push.
      - name: Live protocol tests
        run: ./scripts/live-tests.sh

  # Dependency licences. The allow-list in deny.toml is the machine-readable half of
  # docs/licensing-references.md: a dependency whose licence is not on it fails here rather than
  # being noticed later by somebody reading Cargo.lock.
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
