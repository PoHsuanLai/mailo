name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A failure that only shows up in a release build is a failure nobody sees until it ships,
  # but debug builds of this workspace are large; this keeps the cache useful without the size.
  CARGO_INCREMENTAL: 0
  # Line tables only, for the workspace's own crates too (Cargo.toml already does this for
  # dependencies): a failing test's backtrace still names file and line, and a cold target dir for
  # clippy plus the tests is ~19 GB rather than ~25 GB, which is disk a hosted runner has and
  # cache it restores faster.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A new push to a pull request cancels the run for the push before it, which nobody reads any
# more. Runs on master each have their own group (the run id), so none is cancelled there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A pull request runs `check`, `live`, `relay` and `licences`: the gates, real sockets, the push
# relay and licences, all on Linux. The other distributions and macOS and Windows run on master
# (and by hand), where a failure is fixed forward, so a pull request does not wait on the slowest
# runner in the file.
jobs:
  # The gates that need no servers and no window. Everything here must pass for every push.
  check:
    runs-on: ubuntu-latest
    # Every job here has a timeout, because the default is six hours and a deadlocked test does
    # not fail — it waits. A hung `portable` job burnt an hour and forty minutes of a Windows
    # runner before anyone looked; a limit turns that into a red cross in a known time.
    #
    # Cold (no cache), this job builds Blitz, stylo, wgpu and parley twice, for clippy and for
    # the tests. Measured with a clean target dir: clippy ~570 CPU-seconds, the test build ~1400,
    # the test run ~80 s of wall time (the headless window suite waits on its own clock). On a
    # four-core runner that is ~15-18 minutes with setup; 40 leaves room for a slow runner and a
    # cache miss without letting a hang run for long.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The window is quire's `ds-blitz` (Blitz, wgpu), and the one system library that stack
      # links at build time is fontconfig (parley's font discovery, `yeslogic-fontconfig-sys`).
      # Wayland, X11 and xkbcommon are opened at run time, and wgpu finds its drivers the same
      # way, so the tests that drive the window headlessly (`tests/app/native_harness.rs`) need no GPU
      # and no display.
      #
      # The print tests (`ui::print::pdf_tests`) set Chinese, Japanese and Korean mail in Noto's
      # regional CJK faces and check which face each message was embedded in; without them the
      # CJK falls to whatever face fontconfig has, and those tests fail. `live` below runs only
      # the `#[ignore]`d socket tests, so it goes without.
      - name: System libraries for the window, and the CJK faces print is tested with
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev fonts-noto-cjk

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Saved even when a step fails, so a cold run that ends red still leaves the dependencies
      # built for the next one instead of paying for Blitz again.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Formatting
        run: cargo fmt --all --check

      # `-D warnings` here rather than in `RUSTFLAGS`: that variable applies to dependencies
      # too, so a warning in somebody else's crate would fail this build for a reason nobody
      # here can fix.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # No network: everything that talks to a socket is `#[ignore]`d and runs in `live` below.
      # The window is driven headlessly among them. nextest runs each test in its own process and
      # names a hang; it runs no doctests, so they are a step of their own.
      - name: Tests
        run: cargo nextest run --workspace
      - name: Doctests
        run: cargo test --workspace --doc

      # The rule the whole design rests on: the three pure crates must not be able to reach an
      # I/O dependency. It is checked mechanically because a person reading Cargo.toml will not
      # notice a transitive edge.
      - name: The sans-I/O boundary
        run: ./scripts/check-boundary.sh

      # A failure in a library crate is propagated, shown, logged or deliberately ignored with a
      # comment saying why, never dropped in silence: held by a ratchet on the uncommented
      # `let _ =`, `.ok()` and `unwrap_or_default()` lines (scripts/discards.txt).
      - name: No silent discards
        run: ./scripts/check-discards.sh

      # Every word the window shows lives in crates/mail-ui/src/ui/copy/, by kind: held by a
      # ratchet on the visible string literals still written elsewhere under ui/
      # (scripts/copy-literals.txt).
      - name: The window's words are in ui/copy
        run: ./scripts/check-copy.sh

      # The [patch] block is quire's fork block exactly (vello, anyrender, dioxus): checked against
      # quire's own docs/fork-patches.toml at the pinned rev, never against a copy kept here.
      - name: The fork patches are quire's
        run: ./scripts/check-fork-patches.sh

      # The portable core builds without our desktop's extras (design/36 section 4): the proxy,
      # until a macOS and a Windows runner say so themselves, for "no zbus transport needed".
      - name: Portable build (no desktop extras)
        run: cargo check --workspace --no-default-features

      # Each library crate alone with nothing on, and mail-mime with each crypto half alone: a
      # `--workspace` check unifies the features `mail-app` turns on and would not notice a crate
      # that needs one of its own.
      - name: Every library crate builds with no features
        run: ./scripts/check-nodef.sh

  # The same build and tests on Fedora and Arch, inside their own images: a package name or a
  # library version that only one distribution has shows up here rather than on a person's
  # machine. The Ubuntu `check` above is the floor for the gates (formatting, clippy, the
  # scripts); this one builds the workspace and runs the tests. The libraries are the same set
  # `check` installs: fontconfig to build, the Noto CJK faces for the print tests, and clang, cmake
  # and perl for the dependencies that compile C (aws-lc, the vendored OpenSSL under SQLCipher).
  distros:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            install: >-
              dnf install -y git curl tar gcc gcc-c++ make cmake clang perl-core
              pkgconf-pkg-config fontconfig-devel google-noto-sans-cjk-fonts
              google-noto-serif-cjk-fonts dbus-daemon
          - image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm --needed git curl tar base-devel cmake clang perl
              fontconfig noto-fonts-cjk
    # Cold, the same builds as `check` less clippy; 40 matches it.
    timeout-minutes: 40
    steps:
      # Before the checkout, because the images carry neither git nor a compiler.
      - name: System libraries for the window, and the CJK faces print is tested with
        run: ${{ matrix.install }}
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.image }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests
        run: cargo nextest run --workspace
      - name: Doctests
        run: cargo test --workspace --doc

  # Real sockets, against servers this repository did not write: a Twisted IMAP4Server, an
  # aiosmtpd SMTP server, and a POP3 server. Separate from `check` because it needs Python and a
  # few seconds of setup, and because a failure here means something different — the protocol
  # met a real implementation and disagreed with it.
  live:
    runs-on: ubuntu-latest
    # `sync_path` is a mail-core test (it was a mail-app one, which built the window stack first),
    # so a cold run here no longer builds Blitz and wgpu before any socket opens.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the window
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Local servers only. `--network` would also run the CAPA probe against a real server,
      # which is someone else's machine and not something CI should reach for on every push.
      - name: Live protocol tests
        run: ./scripts/live-tests.sh

  # The whole workspace on macOS and Windows: build, clippy and the tests. mailo runs on all three,
  # with the keyring, notifications, file dialogs and per-user directories each on the platform's
  # own, and a claim like that checked only on Linux is a claim rather than a fact.
  #
  # A test that cannot hold on a platform says so itself with a `cfg` on the test, rather than
  # being skipped here, so what is not checked where is written beside what it checks.
  portable:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Cold, this builds Blitz, stylo and wgpu twice (clippy, then the tests), which `check` puts at
    # ~15-18 minutes on a four-core Linux runner. The macOS runners are about as fast; Windows is
    # the slowest runner and the most expensive minute in this file, and was once the job that
    # hung. 60 leaves room for a cold cache there without letting a hang run for long.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `--no-default-features`: the `quire-desktop` feature (opening a saved file in anyview over
      # the session bus) is our desktop's extras and is on by default for a Linux build; here the
      # portable build is what is built and tested (quire design/36 rule 3).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # No network, as in `check`: everything that talks to a socket is `#[ignore]`d.
      - name: Tests
        run: cargo nextest run --workspace --no-default-features
      - name: Doctests
        run: cargo test --workspace --doc --no-default-features
      # The default features on a Mac: the build a person gets from a plain `cargo build`, which
      # the two steps above never compile. Only checked, not run, and only on macOS until a
      # Windows runner says the same of itself.
      - name: Default features
        if: runner.os == 'macOS'
        run: cargo check --workspace --all-targets

  # Unsigned packages for each platform, on every push to master and by hand. They are artifacts
  # of the run, not a release: nothing here publishes anything.
  #
  # Signing is left out. Where it would go: the macOS app and .dmg in packaging/macos/bundle.sh
  # (a Developer ID certificate and notarisation credentials as secrets), and the Windows MSI with
  # `signtool` after `cargo wix` below (a code-signing certificate as a secret). Neither exists
  # yet, so macOS says the developer cannot be verified and Windows SmartScreen warns, as README
  # says.
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    strategy:
      fail-fast: false
      matrix:
        # WiX Toolset v3, which cargo-wix drives, is on the windows-2022 image; the MSI step
        # installs it where it is not.
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    # One release build (fat LTO over one codegen unit, about two and a half times a thin build)
    # and the packaging tools, cold.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package

      # Linux: a .deb and an .rpm through scripts/package.sh, which makes the release build.
      - name: System libraries for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - name: Packaging tools (Linux)
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-deb cargo-generate-rpm
      - name: .deb and .rpm
        if: runner.os == 'Linux'
        run: ./scripts/package.sh deb rpm
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: mailo-linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error

      # macOS: mailo.app in a .dmg.
      - name: mailo.app and .dmg
        if: runner.os == 'macOS'
        run: ./packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: mailo-macos
          path: target/macos/*.dmg
          if-no-files-found: error

      # Windows: an MSI through cargo-wix, registering mailo for mailto: links.
      - name: Release build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked --no-default-features -p mail-app --bin mailo
      - name: Icon (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p target/wix
          cp packaging/windows/mailo.ico target/wix/mailo.ico
      - name: MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --locked cargo-wix
          if ($env:WIX) {
            $wix = $env:WIX
          } else {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            $wix = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14'
          }
          cargo wix --package mail-app --no-build --nocapture `
            --bin-path (Join-Path $wix 'bin') `
            --include packaging/windows/main.wxs `
            --output target/wix/mailo-x86_64.msi
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: mailo-windows
          path: target/wix/*.msi
          if-no-files-found: error

  # The push relay (relay/, a Cloudflare Worker in TypeScript): its types, its tests inside workerd
  # through Miniflare (nothing deployed, no Cloudflare account), and its npm licences against the
  # allow-list in relay/scripts/licences.mjs, which is deny.toml's for the npm tree.
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install, exactly as locked
        run: npm ci
      - name: Licences
        run: npm run licences
      - name: TypeScript
        run: npm run check
      - name: Tests
        run: npm test
      # The image relay (relay/image) is its own package with no dependencies: its rules run
      # under Node, nothing deployed.
      - name: Image relay tests
        working-directory: relay/image
        run: npm test

  # Dependency licences: a dependency whose licence is not on deny.toml's allow-list fails here
  # rather than being noticed later by somebody reading Cargo.lock.
  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  # Security advisories (RustSec) against Cargo.lock: a new one fails here; the known ones are
  # listed in deny.toml with why each does not reach mailo.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
