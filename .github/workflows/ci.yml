name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A failure that only shows up in a release build is a failure nobody sees until it ships,
  # but debug builds of this workspace are large; this keeps the cache useful without the size.
  CARGO_INCREMENTAL: 0
  # Line tables only, for the workspace's own crates too (Cargo.toml already does this for
  # dependencies): a failing test's backtrace still names file and line, and a cold target dir for
  # clippy plus the tests is ~19 GB rather than ~25 GB, which is disk a hosted runner has and
  # cache it restores faster.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # The gates that need no servers and no window. Everything here must pass for every push.
  check:
    runs-on: ubuntu-latest
    # Every job here has a timeout, because the default is six hours and a deadlocked test does
    # not fail — it waits. A hung `portable` job burnt an hour and forty minutes of a Windows
    # runner before anyone looked; a limit turns that into a red cross in a known time.
    #
    # Cold (no cache), this job builds Blitz, stylo, wgpu and parley twice, for clippy and for
    # the tests. Measured with a clean target dir: clippy ~570 CPU-seconds, the test build ~1400,
    # the test run ~80 s of wall time (the headless window suite waits on its own clock). On a
    # four-core runner that is ~15-18 minutes with setup; 40 leaves room for a slow runner and a
    # cache miss without letting a hang run for long.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The window is quire's `ds-blitz` (Blitz, wgpu), and the one system library that stack
      # links at build time is fontconfig (parley's font discovery, `yeslogic-fontconfig-sys`).
      # Wayland, X11 and xkbcommon are opened at run time, and wgpu finds its drivers the same
      # way, so the tests that drive the window headlessly (`tests/native_harness.rs`) need no GPU
      # and no display.
      #
      # The print tests (`ui::print::pdf_tests`) set Chinese, Japanese and Korean mail in Noto's
      # regional CJK faces and check which face each message was embedded in; without them the
      # CJK falls to whatever face fontconfig has, and those tests fail. `live` below runs only
      # the `#[ignore]`d socket tests, so it goes without.
      - name: System libraries for the window, and the CJK faces print is tested with
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev fonts-noto-cjk

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Saved even when a step fails, so a cold run that ends red still leaves the dependencies
      # built for the next one instead of paying for Blitz again.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Formatting
        run: cargo fmt --all --check

      # `-D warnings` here rather than in `RUSTFLAGS`: that variable applies to dependencies
      # too, so a warning in somebody else's crate would fail this build for a reason nobody
      # here can fix.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No network: everything that talks to a socket is `#[ignore]`d and runs in `live` below.
      # The window is driven headlessly among them.
      - name: Tests
        run: cargo test --workspace

      # The rule the whole design rests on: the three pure crates must not be able to reach an
      # I/O dependency. It is checked mechanically because a person reading Cargo.toml will not
      # notice a transitive edge.
      - name: The sans-I/O boundary
        run: ./scripts/check-boundary.sh

      # The portable core builds without our desktop's extras (design/36 section 4): the proxy,
      # until a macOS and a Windows runner say so themselves, for "no zbus transport needed".
      - name: Portable build (no desktop extras)
        run: cargo check --workspace --no-default-features

  # Real sockets, against servers this repository did not write: a Twisted IMAP4Server, an
  # aiosmtpd SMTP server, and a POP3 server. Separate from `check` because it needs Python and a
  # few seconds of setup, and because a failure here means something different — the protocol
  # met a real implementation and disagreed with it.
  live:
    runs-on: ubuntu-latest
    # `sync_path` is a mail-core test (it was a mail-app one, which built the window stack first),
    # so a cold run here no longer builds Blitz and wgpu before any socket opens.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the window
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Local servers only. `--network` would also run the CAPA probe against a real server,
      # which is someone else's machine and not something CI should reach for on every push.
      - name: Live protocol tests
        run: ./scripts/live-tests.sh

  # The whole workspace on macOS and Windows: build, clippy and the tests. Until 2026-09-27 only
  # `latchkey` ran here and the rest was Linux-only on purpose; mailo now runs on all three, with
  # the keyring, notifications, file dialogs and per-user directories each on the platform's own
  # (FINDINGS), and a claim like that checked only on Linux is a claim rather than a fact.
  #
  # A test that cannot hold on a platform says so itself with a `cfg` on the test, rather than
  # being skipped here, so what is not checked where is written beside what it checks.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Cold, this builds Blitz, stylo and wgpu twice (clippy, then the tests), which `check` puts at
    # ~15-18 minutes on a four-core Linux runner. The macOS runners are about as fast; Windows is
    # the slowest runner and the most expensive minute in this file, and was once the job that
    # hung. 60 leaves room for a cold cache there without letting a hang run for long.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `--no-default-features`: the `quire-desktop` feature (the link to accountd over D-Bus) is
      # our desktop's extras and is on by default for a Linux build; here the in-process path is
      # what is built and tested, with no zbus transport in the tree (quire design/36 rule 3).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      # No network, as in `check`: everything that talks to a socket is `#[ignore]`d.
      - name: Tests
        run: cargo test --workspace --no-default-features

  # Unsigned packages for each platform, on every push to master and by hand. They are artifacts
  # of the run, not a release: nothing here publishes anything.
  #
  # Signing is left out. Where it would go: the macOS app and .dmg in packaging/macos/bundle.sh
  # (a Developer ID certificate and notarisation credentials as secrets), and the Windows MSI with
  # `signtool` after `cargo wix` below (a code-signing certificate as a secret). Neither exists
  # yet, so macOS says the developer cannot be verified and Windows SmartScreen warns, as README
  # says.
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    strategy:
      fail-fast: false
      matrix:
        # WiX Toolset v3, which cargo-wix drives, is on the windows-2022 image; the MSI step
        # installs it where it is not.
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    # One release build (thin LTO) and the packaging tools, cold.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package

      # Linux: a .deb and an .rpm through scripts/package.sh, which makes the release build.
      - name: System libraries for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - name: Packaging tools (Linux)
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-deb cargo-generate-rpm
      - name: .deb and .rpm
        if: runner.os == 'Linux'
        run: ./scripts/package.sh deb rpm
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: mailo-linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error

      # The icon for macOS and Windows is drawn at build time from the one SVG Linux installs.
      - name: Icon renderer
        if: runner.os != 'Linux'
        run: cargo install --locked resvg

      # macOS: mailo.app in a .dmg.
      - name: mailo.app and .dmg
        if: runner.os == 'macOS'
        run: ./packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: mailo-macos
          path: target/macos/*.dmg
          if-no-files-found: error

      # Windows: an MSI through cargo-wix, registering mailo for mailto: links.
      - name: Release build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked --no-default-features -p mail-app --bin mailo
      - name: Icon (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p target/wix
          svg=packaging/icons/hicolor/scalable/apps/mailo.svg
          for size in 16 24 32 48 64 256; do
            resvg --width "$size" --height "$size" "$svg" "target/wix/icon-$size.png"
          done
          python packaging/windows/make-ico.py target/wix/mailo.ico \
            target/wix/icon-16.png target/wix/icon-24.png target/wix/icon-32.png \
            target/wix/icon-48.png target/wix/icon-64.png target/wix/icon-256.png
      - name: MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --locked cargo-wix
          if ($env:WIX) {
            $wix = $env:WIX
          } else {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            $wix = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14'
          }
          cargo wix --package mail-app --no-build --nocapture `
            --bin-path (Join-Path $wix 'bin') `
            --include packaging/windows/main.wxs `
            --output target/wix/mailo-x86_64.msi
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: mailo-windows
          path: target/wix/*.msi
          if-no-files-found: error

  # Dependency licences. The allow-list in deny.toml is the machine-readable half of
  # docs/licensing-references.md: a dependency whose licence is not on it fails here rather than
  # being noticed later by somebody reading Cargo.lock.
  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
