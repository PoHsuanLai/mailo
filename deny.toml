# cargo-deny licence gate. Run: cargo deny check licenses
#
# The allow-list is the machine-readable half of docs/licensing-references.md. A dependency whose
# licence is not listed fails CI rather than being noticed later by someone reading Cargo.lock.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    # Weak, file-level copyleft. The long note below says why this one is here and GPL is not.
    "MPL-2.0",
]
confidence-threshold = 0.9

# MPL-2.0 is allowed, and it is a decision rather than an oversight.
#
# `docs/licensing-references.md` puts MPL at tier **R**: file-level copyleft, fine to link or
# depend on, never to paste source from. That position is about the *licence*, so encoding it
# per-crate would be busywork — the crates arrive under it by several unrelated routes, and the
# versions churn:
#
#   cssparser 0.38, cssparser-macros, dtoa-short   ← ammonia ← mail-mime (the sanitizer)
#   cssparser 0.37                                 ← ds (quire's stylesheet lint)
#   nucleo-matcher                                 ← mail-app (the menus' fuzzy match)
#   option-ext                                     ← dirs
#   stylo and its crates, selectors 0.40, app_units, to_shmem, uluru
#                                                  ← blitz-dom ← ds-native (the CSS engine Blitz
#                                                    draws the window with, Servo's)
#
# Depending on them obliges us to make *those files'* source available, which crates.io already
# does, and obliges nothing of ours. The rule that actually constrains this repository — do not
# copy MPL source into it — is not something a dependency gate can check, and lives in
# CONVENTIONS.md and the licensing notes where it can be read by the person about to break it.
#
# What stays out of that list is strong copyleft: GPL, AGPL, EUPL. Those would change what this
# project may be distributed as, and a dependency arriving under one should stop the build.

# Mozilla's CA root bundle, via reqwest → hyper-rustls. Scoped to the one crate because unlike
# MPL this is not a policy, it is a one-off: the licence covers the *data* — which certificate
# authorities to trust — rather than code, which is why it is a CDLA and not one of the usual
# four. Permissive, with no obligation reaching anything that reads it.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# The Windows clipboard, for the window: clipboard-win and its error type
# ← arboard ← blitz-shell ← ds-native (copy and paste in every field, `ds_native::clipboard`).
# Boost's licence, permissive with no obligation on a binary; scoped to the two crates rather than
# allowed wholesale because it arrives by this one route, and on Linux is not even compiled.
[[licenses.exceptions]]
name = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "error-code"
allow = ["BSL-1.0"]

# Unsupported test DOM, pinned to html5ever 0.39. A second parser generation
# reading ammonia's 0.40 output is where mutation-XSS lives.
#
# The ban is on this crate, not on html5ever 0.39, which the window does carry:
# blitz-html (← dioxus-native ← ds-native) parses an `<iframe srcdoc>` into a sub-document with
# it. That copy is renderer-side and reads only what mail-mime's ammonia pass already wrote
# (the reader's Original view), into a separate document with no scripts, no shared DOM and no
# shared cascade. A parser differential there can at worst change markup inside the frame; it
# cannot reach the window's own document, which is what this ban protects. Nothing in mailo
# parses mail with 0.39, and nothing may: mail-mime's sanitizer stays on ammonia's html5ever.
[[bans.deny]]
name = "markup5ever_rcdom"
reason = "Unsupported test DOM on html5ever 0.39; parsing ammonia 0.40 output with it is the mutation-XSS route this parser refused."
