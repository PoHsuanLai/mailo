# cargo-deny licence gate. Run: cargo deny check licenses
#
# The allow-list is the machine-readable half of docs/licensing-references.md. A dependency whose
# licence is not listed fails CI rather than being noticed later by someone reading Cargo.lock.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

# Strong and weak copyleft are absent on purpose. Adding one is a deliberate decision that
# changes what this project may be distributed as, not a dependency bump.
